name: bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: basket-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ vars.BOT_TOKEN }}
          CHAT_ID: ${{ vars.CHAT_ID }}
          PORT: 8080
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python basket_bot.py &
          BOT_PID=$!
          sleep 20700
          kill $BOT_PID || true

      - name: Relaunch (самозапуск следующего воркера)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GH_API_URL/repos/$GH_REPO/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}' || true
