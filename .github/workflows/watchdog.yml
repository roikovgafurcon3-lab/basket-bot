name: watchdog

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure bot is alive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          count=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GH_API_URL/repos/$GH_REPO/actions/workflows/bot.yml/runs?per_page=1&status=in_progress" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('total_count',0))")
          echo "Активных воркеров: $count"
          if [ "$count" -eq 0 ]; then
            echo "Запускаю бота."
            curl -sS -X POST -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$GH_API_URL/repos/$GH_REPO/actions/workflows/bot.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "Бот уже работает, ничего не делаю."
          fi
